<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskBoard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light">
<nav class="navbar navbar-expand navbar-dark bg-dark mb-4"><div class="container">
  <a class="navbar-brand" href="/">TaskBoard</a>
  <div class="navbar-nav me-auto"><a class="nav-link" href="/">Projects</a><a class="nav-link" href="/notifications/">Notifications {% if unread %}<span class="badge bg-danger">{{ unread }}</span>{% endif %}</a></div>
  <div class="navbar-nav">
  {% if user.is_authenticated %}
    <span class="navbar-text me-3">Hi, {{ user.username }}</span>
    <form method="post" action="{% url 'logout' %}" class="d-inline">{% csrf_token %}<button class="btn btn-outline-light btn-sm">Logout</button></form>
  {% else %}
    <a class="nav-link" href="{% url 'login' %}">Login</a><a class="nav-link" href="{% url 'register' %}">Register</a>
  {% endif %}</div></div></nav>
<div class="container">
{% for m in messages %}<div class="alert alert-info">{{ m }}</div>{% endfor %}
{% block content %}{% endblock %}
</div></body></html>
