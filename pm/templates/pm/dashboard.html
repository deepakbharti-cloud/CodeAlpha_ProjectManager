{% extends 'base.html' %}{% block content %}<div class="row"><div class="col-md-4"><form method="post" class="card card-body">{% csrf_token %}<h5>New Project</h5>
<input name="name" class="form-control mb-2" placeholder="Project name" required><textarea name="description" class="form-control mb-2" placeholder="Description"></textarea><button class="btn btn-primary">Create</button></form></div>
<div class="col-md-8"><h4>Your Projects</h4>{% for p in projects %}<a href="{% url 'board' p.pk %}" class="list-group-item list-group-item-action"><b>{{ p.name }}</b> <small class="text-muted">· {{ p.tasks.count }} tasks · {{ p.members.count }} members</small></a>{% empty %}<p>No projects yet.</p>{% endfor %}</div></div>{% endblock %}
